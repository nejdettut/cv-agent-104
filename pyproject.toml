[project]
name = "cv-agent"
version = "0.1.0"
description = "AI-powered CV Coach Agent — LangGraph + Groq + Streamlit"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40.0",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langgraph>=0.2.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.24.0",
    "pydantic>=2.7.0",
    "gtts>=2.5.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

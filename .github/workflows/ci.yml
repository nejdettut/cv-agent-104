name: CI — Lint & Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ⚡ Install uv
        run: pip install uv

      - name: 📦 Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: 🧹 Ruff lint
        run: |
          pip install ruff
          ruff check . --ignore E501 --ignore F401

      - name: 🧪 Pytest
        run: pytest tests/ -v
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
